services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: api-laido
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/http.d/default.conf
      - ./docker/nginx/certs:/etc/letsencrypt
      - ./docker/nginx/www:/var/www/certbot
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    depends_on:
      - db
      - redis
    networks:
      - laido-network

  certbot:
    image: certbot/certbot
    volumes:
      - ./docker/nginx/certs:/etc/letsencrypt
      - ./docker/nginx/www:/var/www/certbot

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: admin-laido
      MYSQL_USER: admin
      MYSQL_PASSWORD: 40CZtw1obKvN53K7OGIZ6g==
      MYSQL_ROOT_PASSWORD: YUG5rvClS4+YOFcsS6NXkQ==
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - laido-network

  redis:
    image: redis:alpine
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - laido-network

networks:
  laido-network:
    driver: bridge

volumes:
  db-data:
  build-assets:
